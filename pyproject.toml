[project]

name = "carlomitchener"
version = "0.1.0"
description = "MrlyMath and friends: one environment for every script in the repo"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "botocore[crt]",
    "numpy",
    "pillow",
]

[dependency-groups]

font = ["brotli", "fonttools", "skia-pathops"]
plots = ["matplotlib"]

[build-system]

requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

include = ["mrlypy", "mrlypy.*"]
