[project]

name = "carlomitchener"
version = "0.1.0"
license = "MIT"
description = "MrlyMath and friends: one environment for every script in the repo"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "botocore[crt]",
    "numpy",
    "pillow",
    "mrly",
]

[dependency-groups]

avatar = ["scipy"]
plots = ["matplotlib"]

[build-system]

requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

where = [".", "shop"]
include = ["automator*"]

[tool.uv.sources]

mrly = { git = "https://github.com/mrlyprod/mrlyprod", subdirectory = "bindings/py" }
