[project]

name = "carlomitchener"
version = "0.1.0"
description = "MrlyMath and friends: one environment for every script in the repo"
requires-python = ">=3.10"
dependencies = [
    "mrlyprod",
]

[dependency-groups]

cloud = ["boto3"]
font = ["brotli", "fonttools", "skia-pathops"]
plots = ["matplotlib"]

[tool.uv]

package = false

[tool.uv.workspace]

members = ["mrlyprod"]

[tool.uv.sources]

mrlyprod = { workspace = true }
