[build-system]

requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "mrly"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
]

[tool.setuptools]

packages = [
    "mrlybang",
    "mrlybranch",
    "mrlycloud",
    "mrlycore",
    "mrlygen",
    "mrlylife",
    "mrlymusic",
    "mrlypaint",
    "mrlysix",
    "mrlythree",
    "mrlytile",
    "mrlytwo",
]

[tool.setuptools.package-dir]

mrlybang = "mrlybang"
mrlybranch = "mrlybranch"
mrlycloud = "mrlycloud"
mrlycore = "mrlycore"
mrlygen = "mrlygen"
mrlylife = "mrlylife"
mrlymusic = "mrlymusic"
mrlypaint = "mrlypaint"
mrlysix = "mrlysix"
mrlythree = "mrlythree"
mrlytile = "mrlytile"
mrlytwo = "mrlytwo"

[tool.pyright]
