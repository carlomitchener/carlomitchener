[workspace]
resolver = "3"
members = ["packages/rs/*"]
exclude = ["research", "data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
mrly-error = { path = "../../mrlyprod/mrlyprod/packages/rs/error" }
mrly-fft = { path = "../../mrlyprod/mrlyprod/packages/rs/fft" }
mrly-num = { path = "../../mrlyprod/mrlyprod/packages/rs/num" }
serde = { version = "1", features = ["derive"] }
